# --- FAILURE MODES ---
top_failure_modes:
  - description: "Carrier record has wrong MC number or outdated insurance, discovered when load is already tendered"
    frequency: "multiple times per week"
    impact: "load must be re-tendered, delays 2-6 hours, erodes carrier trust score"
  - description: "Rate entered in wrong unit — per mile vs flat rate — causing invoice mismatch"
    frequency: "~10-15% of rate discrepancies trace to this"
    impact: "$200-800 per occurrence depending on lane distance"
  - description: "Load status shows delivered but POD (proof of delivery) is missing from the system"
    frequency: "~5% of completed loads"
    impact: "blocks invoicing, delays payment cycle, requires manual follow-up with carrier"

# --- DATA QUALITY ---
data_quality_estimate: "70% of daily operational work is identifying and fixing data quality issues"
common_data_issues:
  - "Wrong or outdated MC numbers on carrier records"
  - "Rate entered in wrong unit (per mile vs flat rate)"
  - "Load status says delivered but POD document is missing"
  - "Duplicate carrier entries with slightly different names"
  - "Accessorial charges not included in original rate tender, appearing at invoice"

# --- AUTOMATION OPPORTUNITIES ---
automation_gaps:
  - task: "Carrier insurance verification before load tender"
    current_process: "Manual lookup in FMCSA database or carrier portal"
    estimated_time_saved: "3-5 hours/week"
    blocker: "No API integration with FMCSA, multiple carrier portals with different formats"
  - task: "Invoice-to-rate reconciliation"
    current_process: "Manual comparison of invoice line items against original rate confirmation"
    estimated_time_saved: "8-10 hours/week"
